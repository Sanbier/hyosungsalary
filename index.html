<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <!-- iOS Optimization: 
         - width=device-width: Chiều rộng chuẩn thiết bị
         - initial-scale=1.0: Tỉ lệ ban đầu 1:1
         - maximum-scale=1.0: Không cho phóng to hơn 1:1
         - user-scalable=no: Chặn người dùng zoom thủ công
         - viewport-fit=cover: Tràn viền (cho iPhone tai thỏ/dynamic island)
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- iOS Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Hyosung Salary">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    
    <title>Bảng Tính Lương Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Lobster&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              lobster: ['Lobster', 'cursive'],
            },
            colors: {
              glass: {
                surface: 'rgba(255, 255, 255, 0.7)',
                border: 'rgba(255, 255, 255, 0.5)',
              }
            },
            boxShadow: {
              'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.07)',
              'glass-hover': '0 8px 32px 0 rgba(31, 38, 135, 0.15)',
              'glow': '0 0 20px rgba(99, 102, 241, 0.3)',
            },
            animation: {
              'blob': 'blob 20s infinite', /* Slowed down from 7s to 20s for performance */
            },
            keyframes: {
              blob: {
                '0%': { transform: 'translate3d(0px, 0px, 0px) scale(1)' },
                '33%': { transform: 'translate3d(30px, -50px, 0px) scale(1.1)' },
                '66%': { transform: 'translate3d(-20px, 20px, 0px) scale(0.9)' },
                '100%': { transform: 'translate3d(0px, 0px, 0px) scale(1)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #F3F4F6;
        min-height: 100vh;
        color: #1F2937;
        overflow-x: hidden;
        /* Prevent pull-to-refresh and overscroll bounce effect on iOS */
        overscroll-behavior-y: none;
        /* Disable text selection to feel like an app (except inputs) */
        -webkit-user-select: none;
        user-select: none;
        /* Faster tap response */
        touch-action: manipulation;
        /* Font smoothing */
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      /* Re-enable text selection for inputs */
      input, textarea {
        -webkit-user-select: text;
        user-select: text;
      }

      /* Abstract Background Shapes - Optimized for GPU */
      .bg-aurora {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        overflow: hidden;
        background: #F8FAFC;
        /* Create a new stacking context */
        transform: translate3d(0,0,0); 
      }
      
      .shape-1, .shape-2, .shape-3 {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px); /* Increased blur slightly to mask low-res rendering */
        will-change: transform; /* Inform browser to optimize for transform changes */
        backface-visibility: hidden; /* Prevent flickering */
        transform: translate3d(0, 0, 0); /* Trigger hardware acceleration */
      }
      
      .shape-1 {
        top: -10%;
        left: -10%;
        width: 50vw;
        height: 50vw;
        background: radial-gradient(circle, rgba(167, 139, 250, 0.4) 0%, rgba(255, 255, 255, 0) 70%);
        animation: blob 20s infinite alternate;
      }
      
      .shape-2 {
        bottom: -10%;
        right: -10%;
        width: 60vw;
        height: 60vw;
        background: radial-gradient(circle, rgba(96, 165, 250, 0.3) 0%, rgba(255, 255, 255, 0) 70%);
        animation: blob 25s infinite alternate-reverse;
      }

      .shape-3 {
        top: 40%;
        left: 30%;
        width: 40vw;
        height: 40vw;
        background: radial-gradient(circle, rgba(244, 114, 182, 0.2) 0%, rgba(255, 255, 255, 0) 70%);
        animation: blob 18s infinite alternate;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(156, 163, 175, 0.5); 
        border-radius: 10px;
      }
      
      * { -webkit-tap-highlight-color: transparent; }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "path": "https://esm.sh/path@^0.12.7",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div class="bg-aurora">
      <div class="shape-1"></div>
      <div class="shape-2"></div>
      <div class="shape-3"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
